name: EquityCart CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  PROJECT_DIR: './equitycart'
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/equitycart
  REMOTE_APP_DIR: ~/equitycart

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run Gradle tests
        run: ./gradlew clean test --no-daemon

      - name: Package all service boot jars
        run: |
          ./gradlew \
            :discovery-server:bootJar \
            :config-server:bootJar \
            :api-gateway:bootJar \
            :user-service:bootJar \
            :product-service:bootJar \
            :order-service:bootJar \
            :portfolio-service:bootJar \
            :market-data-service:bootJar \
            :ledger-service:bootJar \
            :notification-service:bootJar \
            --no-daemon -x test

  publish-images:
    name: Build and publish container images
    needs: build-and-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push service images
        shell: bash
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          export IMAGE_PREFIX="ghcr.io/${owner}/equitycart"

          services=(
            discovery-server
            config-server
            api-gateway
            user-service
            product-service
            order-service
            portfolio-service
            market-data-service
            ledger-service
            notification-service
          )

          for svc in "${services[@]}"; do
            case "$svc" in
              discovery-server) module_dir="discovery-server" ;;
              config-server) module_dir="config-server" ;;
              api-gateway) module_dir="api-gateway" ;;
              user-service) module_dir="user" ;;
              product-service) module_dir="product" ;;
              order-service) module_dir="order" ;;
              portfolio-service) module_dir="portfolio" ;;
              market-data-service) module_dir="market-data" ;;
              ledger-service) module_dir="ledger" ;;
              notification-service) module_dir="notification" ;;
              *) module_dir="$svc" ;;
            esac

            image_name="${IMAGE_PREFIX}-${svc}"
            docker build \
              --build-arg MODULE_NAME="$svc" \
              --build-arg MODULE_DIR="$module_dir" \
              -f "$GITHUB_WORKSPACE/equitycart/docker/Dockerfile" \
              "$GITHUB_WORKSPACE/equitycart" \
              -t "${image_name}:${IMAGE_TAG}" \
              -t "${image_name}:latest"

            docker push "${image_name}:${IMAGE_TAG}"
            docker push "${image_name}:latest"
          done

  deploy:
    name: Deploy to remote host
    needs: publish-images
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Copy compose files to target host
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: |
            equitycart/docker/docker-pets.yml
            equitycart/docker/docker-compose-services.yml
          target: ${{ env.REMOTE_APP_DIR }}/

      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v1.0.1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            mkdir -p "$HOME/equitycart"
            cd "$HOME/equitycart"

            cat > .env <<EOF
            IMAGE_PREFIX=ghcr.io/${{ github.repository_owner }}/equitycart
            IMAGE_TAG=${{ github.sha }}
            EOF

            docker login ghcr.io -u '${{ github.actor }}' -p '${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}'
            docker compose -f docker-pets.yml -f docker-compose-services.yml pull
            docker compose -f docker-pets.yml -f docker-compose-services.yml up -d --remove-orphans
