# =============================================================================
# GitHub Actions workflow: EquityCart CI/CD
# -----------------------------------------------------------------------------
# A "workflow" is an automated process defined in YAML and stored under
# .github/workflows/. GitHub reads this file and runs the jobs below whenever
# one of the trigger events (see the `on:` block) happens. This particular
# pipeline does Continuous Integration (build + test) and Continuous Delivery
# (build + publish container images) for the EquityCart microservices project.
# =============================================================================

# `name` is the human-friendly label shown in the GitHub "Actions" tab for
# every run of this workflow. Purely cosmetic; it does not affect behavior.
name: EquityCart CI/CD

# -----------------------------------------------------------------------------
# `on` declares WHICH events cause this workflow to run (the "triggers").
# -----------------------------------------------------------------------------
on:
  # Trigger 1: run whenever commits are pushed...
  push:
    branches:
      - main            # ...but only when the push targets the `main` branch.
  # Trigger 2: run when a pull request is opened/updated...
  pull_request:
    branches:
      - main            # ...but only for PRs whose base (target) branch is `main`.
  # Trigger 3: allow a human to start the workflow manually from the GitHub UI
  # (the "Run workflow" button). Handy for re-running without a code change.
  workflow_dispatch:

# -----------------------------------------------------------------------------
# `env` at the top level defines environment variables shared by ALL jobs and
# steps. Centralizing values here avoids repetition and makes updates easy.
# Reference them elsewhere with the ${{ env.NAME }} expression syntax.
# -----------------------------------------------------------------------------
env:
  JAVA_VERSION: '21'                                              # JDK version used to build/test the project.
  PROJECT_DIR: './equitycart'                                     # Subfolder that contains the Gradle project.
  # Base name for the container images. github.repository_owner is the org/user
  # that owns the repo, so images are namespaced under that account on GHCR.
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/equitycart
  REMOTE_APP_DIR: ~/equitycart                                    # Convention for where the app lives on a remote/deploy host.

# -----------------------------------------------------------------------------
# `jobs` is the list of independent units of work. By default jobs run in
# parallel; use `needs:` to force ordering. Each job runs on its own fresh
# virtual machine ("runner"), so state is NOT shared between jobs automatically.
# -----------------------------------------------------------------------------
jobs:
  # ===========================================================================
  # JOB 1: build-and-test  (Continuous Integration)
  # Compiles the code, runs the automated tests, and produces the runnable
  # Spring Boot "boot jars" for every microservice. This is the quality gate:
  # if it fails, the pipeline stops and images are never published.
  # ===========================================================================
  build-and-test:
    name: Build and test                 # Display name for this job in the UI.
    runs-on: ubuntu-latest               # The runner OS/image. `ubuntu-latest` = a fresh, GitHub-hosted Linux VM.
    # `defaults.run.working-directory` sets the folder that every `run:` step
    # starts in, so we don't have to `cd ./equitycart` in each step.
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    # `permissions` scopes the automatic GITHUB_TOKEN. Least-privilege: this job
    # only needs to READ the repository contents, nothing more.
    permissions:
      contents: read
    # `steps` run sequentially, top to bottom, on the same runner. A step is
    # either a reusable action (`uses:`) or a shell command (`run:`).
    steps:
      # Step 1: clone the repository onto the runner so later steps can see the
      # source code. `actions/checkout@v4` is GitHub's official checkout action.
      - name: Checkout source
        uses: actions/checkout@v4

      # Step 2: install a Java Development Kit and configure it on PATH.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin                     # Which JDK build to install (Eclipse Temurin / Adoptium).
          java-version: ${{ env.JAVA_VERSION }}      # Reuses the value defined once in the top-level `env`.
          cache: gradle                             # Caches Gradle downloads/dependencies to speed up future runs.

      # Step 3: the Gradle wrapper script must be executable on Linux before we
      # can invoke it. `chmod +x` grants execute permission.
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # Step 4: run the test suite. `clean` wipes old build output first;
      # `test` compiles and executes unit tests. `--no-daemon` disables the
      # long-lived Gradle background process (better for short-lived CI runners).
      - name: Run Gradle tests
        run: ./gradlew clean test --no-daemon

      # Step 5: build the executable Spring Boot jar for each microservice.
      # The `|` starts a multi-line (literal block) YAML string, and the `\`
      # at each line-end joins everything into one shell command. Each
      # `:module:bootJar` is a Gradle task targeting a specific subproject.
      # `-x test` SKIPS re-running tests here (they already passed in Step 4).
      - name: Package all service boot jars
        run: |
          ./gradlew \
            :discovery-server:bootJar \
            :config-server:bootJar \
            :api-gateway:bootJar \
            :user-service:bootJar \
            :product-service:bootJar \
            :order-service:bootJar \
            :portfolio-service:bootJar \
            :market-data-service:bootJar \
            :ledger-service:bootJar \
            :notification-service:bootJar \
            --no-daemon -x test

  # ===========================================================================
  # JOB 2: publish-images  (Continuous Delivery)
  # Builds a Docker image for every microservice and pushes it to the GitHub
  # Container Registry (GHCR) so the images can be deployed anywhere.
  # ===========================================================================
  publish-images:
    name: Build and publish container images
    # `needs` makes this job WAIT for `build-and-test` to succeed first. If the
    # build/test job fails, this job is skipped — we never publish broken code.
    needs: build-and-test
    # `if` is a conditional guard. This job runs for pushes and manual dispatch,
    # but NOT for pull_request events (we don't publish images for open PRs).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # This job needs to WRITE packages (push images to GHCR) in addition to
    # reading the repo, so it requests broader permissions than Job 1.
    permissions:
      contents: read
      packages: write
    steps:
      # Step 1: check out the source again. Remember: each job gets a clean VM,
      # so nothing from build-and-test carries over — we must re-clone here.
      - name: Checkout source
        uses: actions/checkout@v4

      # Step 2: authenticate to GHCR so `docker push` is allowed.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io                          # The registry hostname to log in to.
          username: ${{ github.actor }}              # The user/account that triggered the run.
          # Use a custom secret token if provided, otherwise fall back to the
          # auto-generated GITHUB_TOKEN. `||` picks the first non-empty value.
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      # Step 3: build and push one image per service via a Bash loop.
      - name: Build and push service images
        shell: bash                                  # Force Bash so `${VAR,,}` (lowercasing) and arrays work.
        env:
          # Tag every image with the commit SHA for a unique, traceable version.
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # `set -euo pipefail` makes the script fail fast and safe:
          #   -e  exit immediately if any command returns an error
          #   -u  error on use of an undefined variable
          #   -o pipefail  a pipeline fails if ANY command in it fails
          set -euo pipefail

          # Container registries require lowercase names. `${VAR,,}` lowercases
          # the whole string, so an owner like "MyOrg" becomes "myorg".
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          # Rebuild the image prefix here using the lowercased owner (the
          # top-level env value could contain uppercase and would be rejected).
          export IMAGE_PREFIX="ghcr.io/${owner}/equitycart"

          # Bash array listing every microservice we need to containerize.
          services=(
            discovery-server
            config-server
            api-gateway
            user-service
            product-service
            order-service
            portfolio-service
            market-data-service
            ledger-service
            notification-service
          )

          # Loop over each service name and build/push its image.
          for svc in "${services[@]}"; do
            # The Gradle module folder name doesn't always match the service
            # name, so map each service to its actual source directory. The
            # Dockerfile receives this via the MODULE_DIR build argument.
            case "$svc" in
              discovery-server) module_dir="discovery-server" ;;
              config-server) module_dir="config-server" ;;
              api-gateway) module_dir="api-gateway" ;;
              user-service) module_dir="user" ;;
              product-service) module_dir="product" ;;
              order-service) module_dir="order" ;;
              portfolio-service) module_dir="portfolio" ;;
              market-data-service) module_dir="market-data" ;;
              ledger-service) module_dir="ledger" ;;
              notification-service) module_dir="notification" ;;
              *) module_dir="$svc" ;;                 # Fallback: use the service name as-is.
            esac

            # Full image name, e.g. ghcr.io/<owner>/equitycart-user-service.
            image_name="${IMAGE_PREFIX}-${svc}"
            # Build the Docker image:
            #   --build-arg  pass values INTO the Dockerfile (which module to package).
            #   -f           path to the shared Dockerfile used by all services.
            #   (positional) the build "context" — the folder Docker can read files from.
            #   -t           tag the image (applied twice: SHA + latest).
            docker build \
              --build-arg MODULE_NAME="$svc" \
              --build-arg MODULE_DIR="$module_dir" \
              -f "$GITHUB_WORKSPACE/equitycart/docker/Dockerfile" \
              "$GITHUB_WORKSPACE/equitycart" \
              -t "${image_name}:${IMAGE_TAG}" \
              -t "${image_name}:latest"

            # Push both tags to GHCR. `:<sha>` is the immutable, traceable
            # version; `:latest` is a moving pointer to the newest build.
            docker push "${image_name}:${IMAGE_TAG}"
            docker push "${image_name}:latest"
          done

