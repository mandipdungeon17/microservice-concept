plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}
configurations.configureEach {
    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
}

dependencies {
    implementation project(':commons')
    implementation project(':ledger-service')
    implementation project(':order-service')
    implementation project(':market-data-service')
    implementation 'org.springframework.boot:spring-boot-starter-log4j2'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.security:spring-security-core'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    // OpenFeign's default HTTP client is java.net.HttpURLConnection (JDK built-in).
    // This class was written in the late 1990s and only supports: GET, POST, PUT, DELETE, HEAD, OPTIONS, TRACE.
    // It does not support PATCH (RFC 5789, added in 2010). Sun/Oracle never updated HttpURLConnection to add it.
    implementation 'io.github.openfeign:feign-hc5'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'
    implementation 'io.zipkin.reporter2:zipkin-reporter-brave'
    runtimeOnly 'org.postgresql:postgresql'

}
jar {
    enabled = true
}
bootJar {
    archiveBaseName.set('portfolio-service')
    archiveVersion.set(project.version.toString())
    archiveClassifier.set('exec')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}