plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}
configurations.configureEach {
    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
}

dependencies {
    implementation project(':commons')
    implementation 'org.springframework.boot:spring-boot-starter-log4j2'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'
    implementation 'io.zipkin.reporter2:zipkin-reporter-brave'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6' //JJWT library API for creating and parsing JWT tokens
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6' //JJWT library implementation for JWT token handling (runtimeOnly — your code only uses the API, not the impl classes)
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6' //JJWT's Jackson integration for JSON serialization inside tokens (runtimeOnly)
    runtimeOnly 'org.postgresql:postgresql'

}
jar {
    enabled = true
}
bootJar {
    archiveBaseName.set('user-service')
    archiveVersion.set(project.version.toString())
    archiveClassifier.set('exec')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}