plugins {
    id 'java-library'
}
dependencies {
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'org.springframework.boot:spring-boot-starter-web'
    api 'org.springframework.cloud:spring-cloud-starter-openfeign'
    api 'org.springframework.boot:spring-boot-starter-security'
    api 'io.jsonwebtoken:jjwt-api:0.12.6' //JJWT library API for creating and parsing JWT tokens
    api 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.kafka:spring-kafka'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6' //JJWT library implementation for JWT token handling (runtimeOnly — your code only uses the API, not the impl classes)
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6' //JJWT's Jackson integration for JSON serialization inside tokens (runtimeOnly)
}