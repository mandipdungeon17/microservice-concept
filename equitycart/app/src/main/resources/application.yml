equitycart:
  sell-to-spend:
    strategy: saga    # "transactional" (default) or "saga"
  saga:
    timeout-seconds: 30
  notification:
    channel: LOG
    webhook-url: http://localhost:9999/webhook
    recipient-email: demo@equitycart.local

spring:
  config:
    import: optional:configserver:http://localhost:8888
  mail:
    host: localhost
    port: 1025
  profiles:
    active: cdc
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false
#  sql:
#    init:
#      mode: always
  application:
    name: equitycart
  datasource:
    url: jdbc:postgresql://localhost:5432/equitycart
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
#    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    mongodb:
      uri: mongodb://localhost:27017/equitycart

    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
  cache:
    type: redis
    redis:
      time-to-live: 600000   # 10 minutes in milliseconds
  kafka:
    # Examples of multiple broker : bootstrap-servers: kafka-1:9092,kafka-2:9092,kafka-3:9092
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: equitycart-group
      auto-offset-reset: earliest # Start from the beginning if no committed offset exists (don't miss events)
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties.spring.json.trusted.packages: com.equitycart.commons.event

server:
  port: 8082

jwt:
  secret: dGhpcyBpcyBhIHNlY3JldCBrZXkgZm9yIGVxdWl0eWNhcnQgand0IHRva2Vu  # base64 of a 256-bit key
  access-token-expiry: 900000    # 15 minutes in milliseconds
  refresh-token-expiry: 7  # 7 days in days

alphaVantage:
  api-key: ${ALPHA_VANTAGE_API_KEY:GABC5OWOK7YA1TG9}
  base-url: https://www.alphavantage.co

resilience4j:
  retry:
    instances:
      alphaVantage:
        max-attempts: 3
        wait-duration: 2s
  circuitbreaker:
    instances:
      alphaVantage:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-size: 10
  rate-limiter:
    instances:
      alphaVantage:
        limit-for-period: 5
        limit-refresh-period: 60s
        timeout-duration: 0s
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always